# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# 1. JVM Arguments & Java Module Openings (CRITICAL for Java 11+)
# These flags "punch holes" in Java's security system so old Room/Kapt versions can work.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 \
  --add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
  --add-opens=java.base/java.lang=ALL-UNNAMED \
  --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
  --add-opens=java.base/java.io=ALL-UNNAMED \
  --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED \
  -Dkotlin.skip.experimental.check=true

# 2. AndroidX & Jetifier
# Ensures compatibility with modern Android libraries.
android.useAndroidX=true
android.enableJetifier=true

# 3. Kotlin & Kapt Settings
# 'use.worker.api=false' is mandatory to make Kapt respect the jvmargs above.
kotlin.code.style=official
kapt.use.worker.api=false
kapt.incremental.apt=false
kapt.verbose=true

# 4. Kotlin Daemon Memory
# Gives the Kotlin compiler its own dedicated heap space.
kotlin.daemon.jvm.options=-Xmx4G